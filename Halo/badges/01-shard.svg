</style>
<g class="g"><polygon points="64.0,8.0 120.0,64.0 95.4,64.0 64.0,32.6" fill="#c8d7e6" stroke="#c8d7e6" stroke-width=".6" stroke-linejoin="round"/><polygon points="120.0,64.0 64.0,120.0 64.0,95.4 95.4,64.0" fill="#879dc9" stroke="#879dc9" stroke-width=".6" stroke-linejoin="round"/><polygon points="64.0,120.0 8.0,64.0 32.6,64.0 64.0,95.4" fill="#8da2cc" stroke="#8da2cc" stroke-width=".6" stroke-linejoin="round"/><polygon points="8.0,64.0 64.0,8.0 64.0,32.6 32.6,64.0" fill="#cedce9" stroke="#cedce9" stroke-width=".6" stroke-linejoin="round"/><polygon points="64.0,8.0 120.0,64.0 64.0,120.0 8.0,64.0" fill="none" stroke="#7293c0" stroke-width="1.6" stroke-linejoin="round"/><polygon points="64.0,32.6 95.4,64.0 64.0,95.4 32.6,64.0" fill="#ced9e9"/><polygon points="64.0,32.6 95.4,64.0 64.0,95.4 32.6,64.0" fill="url(#tb0)" stroke="#87a3c9" stroke-width="1.4" stroke-linejoin="round"/>
<g clip-path="url(#ob0)"><rect class="sw" x="-20" y="-10" width="30" height="150" fill="url(#sb0)" transform="rotate(20 64 64)" opacity=".6"/></g></g>
</svg>