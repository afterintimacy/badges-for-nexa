<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shard">
<title>Shard</title>
<defs><linearGradient id="tb0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#d9e3f2" stop-opacity=".75"/></linearGradient>
<clipPath id="ob0"><polygon points="64.0,8.0 120.0,64.0 64.0,120.0 8.0,64.0"/></clipPath><clipPath id="ib0"><polygon points="64.0,32.6 95.4,64.0 64.0,95.4 32.6,64.0"/></clipPath>
<linearGradient id="sb0" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
@keyframes fl{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-2.5px)}}
@keyframes sw{0%,55%{transform:translateX(-80px)}100%{transform:translateX(200px)}}
@keyframes tw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
