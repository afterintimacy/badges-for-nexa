<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Spire">
<title>Spire</title>
<defs><linearGradient id="tb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#d9e3f2" stop-opacity=".75"/></linearGradient>
<clipPath id="ob2"><polygon points="64.0,6.0 100.0,28.0 100.0,100.0 64.0,122.0 28.0,100.0 28.0,28.0"/></clipPath><clipPath id="ib2"><polygon points="64.0,31.5 84.2,43.8 84.2,84.2 64.0,96.5 43.8,84.2 43.8,43.8"/></clipPath>
<linearGradient id="sb2" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>
@keyframes fl{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-2.5px)}}
@keyframes sw{0%,55%{transform:translateX(-80px)}100%{transform:translateX(200px)}}
