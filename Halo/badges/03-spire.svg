</style>
<g class="g"><polygon points="64.0,6.0 100.0,28.0 84.2,43.8 64.0,31.5" fill="#d4e1ec" stroke="#d4e1ec" stroke-width=".6" stroke-linejoin="round"/><polygon points="100.0,28.0 100.0,100.0 84.2,84.2 84.2,43.8" fill="#a6bad7" stroke="#a6bad7" stroke-width=".6" stroke-linejoin="round"/><polygon points="100.0,100.0 64.0,122.0 64.0,96.5 84.2,84.2" fill="#7e93c5" stroke="#7e93c5" stroke-width=".6" stroke-linejoin="round"/><polygon points="64.0,122.0 28.0,100.0 43.8,84.2 64.0,96.5" fill="#8196c6" stroke="#8196c6" stroke-width=".6" stroke-linejoin="round"/><polygon points="28.0,100.0 28.0,28.0 43.8,43.8 43.8,84.2" fill="#afc2db" stroke="#afc2db" stroke-width=".6" stroke-linejoin="round"/><polygon points="28.0,28.0 64.0,6.0 64.0,31.5 43.8,43.8" fill="#d7e3ed" stroke="#d7e3ed" stroke-width=".6" stroke-linejoin="round"/><polygon points="64.0,6.0 100.0,28.0 100.0,100.0 64.0,122.0 28.0,100.0 28.0,28.0" fill="none" stroke="#7293c0" stroke-width="1.6" stroke-linejoin="round"/><polygon points="64.0,31.5 84.2,43.8 84.2,84.2 64.0,96.5 43.8,84.2 43.8,43.8" fill="#ced9e9"/><polygon points="64.0,31.5 84.2,43.8 84.2,84.2 64.0,96.5 43.8,84.2 43.8,43.8" fill="url(#tb2)" stroke="#87a3c9" stroke-width="1.4" stroke-linejoin="round"/>
